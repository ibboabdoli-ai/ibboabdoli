name: Restore AI and Tawk chat
on:
  push:
    branches: [fix/restore-ai-tawk-chat]
    paths: ['.github/workflows/restore-ai-tawk.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore AI entry points, Tawk loader, privacy disclosure and CSP
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          Path('assets/tawk.js').write_text('''/* tawk.to live-chat loader. Property/widget IDs supplied by the site owner. */\n(() => {\n  let loaded = false;\n  const loadTawk = () => {\n    if (loaded) return;\n    loaded = true;\n    window.Tawk_API = window.Tawk_API || {};\n    window.Tawk_LoadStart = new Date();\n    const s1 = document.createElement("script");\n    const s0 = document.getElementsByTagName("script")[0];\n    s1.async = true;\n    s1.src = "https://embed.tawk.to/6895ddde56ddd81926b30080/1j24mlbt5";\n    s1.charset = "UTF-8";\n    s1.setAttribute("crossorigin", "*");\n    s1.dataset.tawkWidget = "true";\n    s0.parentNode.insertBefore(s1, s0);\n  };\n  window.addEventListener("load", () => window.setTimeout(loadTawk, 2500), { once: true });\n})();\n''')

          pages = [Path('index.html'),Path('en/index.html'),Path('privacy/index.html'),Path('en/privacy/index.html')]
          pages += list(Path('cases').glob('*/index.html')) + list(Path('en/cases').glob('*/index.html'))
          for p in pages:
              text=p.read_text()
              replacements=[
                ('<a href="card/">Kort</a>','<a href="https://ai.ibboabdoli.com" rel="noopener" target="_blank">AI</a><a href="card/">Kort</a>'),
                ('<a href="../card/">Card</a>','<a href="https://ai.ibboabdoli.com" rel="noopener" target="_blank">AI</a><a href="../card/">Card</a>'),
                ('<a href="/card/">Kort</a>','<a href="https://ai.ibboabdoli.com" rel="noopener" target="_blank">AI</a><a href="/card/">Kort</a>'),
                ('<a href="/card/">Card</a>','<a href="https://ai.ibboabdoli.com" rel="noopener" target="_blank">AI</a><a href="/card/">Card</a>'),
              ]
              for old,new in replacements:
                  if old in text and 'href="https://ai.ibboabdoli.com"' not in text:
                      text=text.replace(old,new,1)
              assert 'href="https://ai.ibboabdoli.com"' in text,p
              p.write_text(text)

          marker='<script defer="" src="/assets/site.js"></script>'
          chat_pages=[Path('index.html'),Path('en/index.html')] + list(Path('cases').glob('*/index.html')) + list(Path('en/cases').glob('*/index.html'))
          for p in chat_pages:
              text=p.read_text(); assert marker in text,p
              if '/assets/tawk.js' not in text:
                  text=text.replace(marker,'<script defer="" src="/assets/tawk.js"></script>'+marker,1)
              p.write_text(text)

          sv=Path('privacy/index.html'); text=sv.read_text()
          old='<h2>Teknisk leverans</h2><p>Webbplatsen levereras via Vercel. Webbtypsnitt hämtas från Google Fonts, vilket innebär att webbläsaren kontaktar Googles typsnittsservrar. Denna webbplatskod sätter inga analys- eller marknadsföringscookies. Externa tjänster kan behandla tekniska uppgifter enligt sina egna villkor.</p>'
          new='<h2>Teknisk leverans och livechatt</h2><p>Webbplatsen levereras via Vercel. Webbtypsnitt hämtas från Google Fonts, vilket innebär att webbläsaren kontaktar Googles typsnittsservrar. Livechatten levereras av Tawk.to. När chattwidgeten laddas kan Tawk.to behandla tekniska uppgifter som IP-adress, webbläsare och enhetsinformation samt använda cookies, lokal lagring och sessionslagring för chatt- och besökarfunktioner. Tawk.to har en separat samtyckesfunktion som kan konfigureras i deras dashboard för europeiska besökare. Externa tjänster behandlar uppgifter enligt sina egna villkor.</p>'
          assert old in text
          text=text.replace(old,new,1).replace('<a href="https://developers.google.com/fonts/faq/privacy">Google Fonts</a> · <a href="https://www.imy.se/privatperson/dataskydd/dina-rattigheter/">IMY</a>','<a href="https://developers.google.com/fonts/faq/privacy">Google Fonts</a> · <a href="https://www.tawk.to/privacy-policy/">Tawk.to</a> · <a href="https://www.imy.se/privatperson/dataskydd/dina-rattigheter/">IMY</a>')
          sv.write_text(text)

          en=Path('en/privacy/index.html'); text=en.read_text()
          old='<h2>Technical delivery</h2><p>The website is delivered through Vercel. Web fonts are requested from Google Fonts, so the browser contacts Google’s font servers. This website code sets no analytics or marketing cookies. External services may process technical information under their own terms.</p>'
          new='<h2>Technical delivery and live chat</h2><p>The website is delivered through Vercel. Web fonts are requested from Google Fonts, so the browser contacts Google’s font servers. Live chat is provided by Tawk.to. When the chat widget loads, Tawk.to may process technical data such as IP address, browser and device information and use cookies, local storage and session storage for chat and visitor features. Tawk.to provides a separate consent feature that can be configured in its dashboard for European visitors. External services process information under their own terms.</p>'
          assert old in text
          text=text.replace(old,new,1).replace('<a href="https://developers.google.com/fonts/faq/privacy">Google Fonts</a> · <a href="https://www.imy.se/privatperson/dataskydd/dina-rattigheter/">IMY</a>','<a href="https://developers.google.com/fonts/faq/privacy">Google Fonts</a> · <a href="https://www.tawk.to/privacy-policy/">Tawk.to</a> · <a href="https://www.imy.se/privatperson/dataskydd/dina-rattigheter/">IMY</a>')
          en.write_text(text)

          config_path=Path('vercel.json'); config=json.loads(config_path.read_text()); redirects=config['redirects']
          if not any(r.get('source')=='/ai' for r in redirects):
              redirects[1:1]=[
                {'source':'/ai','destination':'https://ai.ibboabdoli.com','permanent':True},
                {'source':'/ai/','destination':'https://ai.ibboabdoli.com','permanent':True},
              ]
          csp_header=next(h for h in config['headers'][0]['headers'] if h['key']=='Content-Security-Policy'); csp=csp_header['value']
          csp=csp.replace("script-src 'self' ","script-src 'self' https://*.tawk.to https://cdn.jsdelivr.net ",1)
          csp=csp.replace("style-src 'self' https://fonts.googleapis.com","style-src 'self' https://fonts.googleapis.com https://*.tawk.to https://cdn.jsdelivr.net",1)
          csp=csp.replace("font-src 'self' https://fonts.gstatic.com","font-src 'self' https://fonts.gstatic.com https://*.tawk.to",1)
          csp=csp.replace("img-src 'self' data:","img-src 'self' data: https://*.tawk.to https://cdn.jsdelivr.net https://tawk.link https://s3.amazonaws.com",1)
          csp=csp.replace("connect-src 'self' https://formspree.io","connect-src 'self' https://formspree.io https://*.tawk.to wss://*.tawk.to",1)
          csp=csp.replace("form-action 'self' https://formspree.io","form-action 'self' https://formspree.io https://*.tawk.to",1)
          csp=csp.replace("base-uri 'self';","frame-src https://*.tawk.to; base-uri 'self';",1)
          csp_header['value']=csp; config_path.write_text(json.dumps(config,indent=2,ensure_ascii=False)+'\n')

          static=Path('tests/static_checks.py'); text=static.read_text(); marker="assert 'innerHTML' not in (PUBLIC/'assets/site.js').read_text()"
          addition="""assert 'innerHTML' not in (PUBLIC/'assets/site.js').read_text()\ntawk=(PUBLIC/'assets/tawk.js').read_text()\nassert 'embed.tawk.to/6895ddde56ddd81926b30080/1j24mlbt5' in tawk\nassert 'https://*.tawk.to' in csp and 'wss://*.tawk.to' in csp and 'frame-src https://*.tawk.to' in csp\nfor home in ['/', '/en/']:\n    assert 'https://ai.ibboabdoli.com' in pages[home][1]\nassert any(r.get('source')=='/ai' and r.get('destination')=='https://ai.ibboabdoli.com' for r in config['redirects'])"""
          assert marker in text; static.write_text(text.replace(marker,addition,1))

          readme=Path('README.md'); text=readme.read_text(); old='Google Fonts remains an external font request and is described in the privacy information. No analytics SDK or marketing cookies were added.'
          new='Google Fonts remains an external font request. Tawk.to live chat is restored with a delayed external loader and is disclosed in the privacy information. Tawk.to can use cookies/local storage and can monitor visitor sessions while the widget is active; for Sweden/EU, review and enable the Tawk.to Consent Form for European visitors in the Tawk dashboard. The automated website tests mock Tawk and therefore do not verify that dashboard-level consent setting. The Formspree contact-form warning reported on 2026-09-17 remains a separate follow-up: diagnose endpoint/account acceptance first and do not send automated real messages during CI.'
          assert old in text; readme.write_text(text.replace(old,new,1))
          PY
      - name: Static checks and non-invasive Formspree diagnostics
        run: |
          node --check assets/tawk.js
          node scripts/build.mjs
          mkdir -p .qa
          python tests/static_checks.py | tee .qa/static-report.json
          { curl -sS -D .qa/formspree-get.headers -o .qa/formspree-get.body -w '%{http_code}\n' https://formspree.io/f/xqapdadv || true; } | tee .qa/formspree-get.status
          { curl -sS -X OPTIONS -D .qa/formspree-options.headers -o .qa/formspree-options.body -w '%{http_code}\n' https://formspree.io/f/xqapdadv || true; } | tee .qa/formspree-options.status
          echo 'No POST request was sent to Formspree.' > .qa/formspree-note.txt
      - name: Browser regressions plus mocked Tawk bootstrap
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python scripts/serve.py > .qa/http.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          for _ in range(30):
              try: urllib.request.urlopen('http://127.0.0.1:4173/',timeout=2); break
              except Exception: time.sleep(1)
          else: raise RuntimeError('server did not start')
          PY
          python tests/browser_checks.py
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
              context=browser.new_context(); requests=[]
              def mock(route):
                  requests.append(route.request.url)
                  route.fulfill(status=200,content_type='application/javascript',body='window.__tawkMockLoaded=true;')
              context.route('https://embed.tawk.to/**',mock)
              page=context.new_page(); violations=[]
              page.on('console',lambda msg: None)
              page.add_init_script("document.addEventListener('securitypolicyviolation',e=>window.__csp=(window.__csp||[]).concat(e.violatedDirective+':'+e.blockedURI))")
              page.goto('http://127.0.0.1:4173/',wait_until='networkidle'); page.wait_for_timeout(3200)
              assert page.evaluate('window.__tawkMockLoaded===true'), requests
              assert any('embed.tawk.to/6895ddde56ddd81926b30080/1j24mlbt5' in u for u in requests), requests
              assert page.locator('a[href="https://ai.ibboabdoli.com"]').count()>=1
              assert not page.evaluate('window.__csp||[]'), page.evaluate('window.__csp||[]')
              browser.close()
          PY
      - name: Commit tested restoration to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html cases en/cases privacy en/privacy assets/tawk.js vercel.json tests/static_checks.py README.md
          git commit -m 'Restore AI Assistant and Tawk.to chat; record contact form follow-up'
          git push origin HEAD:fix/restore-ai-tawk-chat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-ai-tawk-report
          path: .qa/
          include-hidden-files: true
          retention-days: 7
